				[and]
					terrain=Kh*
				[/and]
				layer=base
			[/terrain]
			[terrain]
				terrain=Kme
				[and]
					terrain=!,Km,!,K*
				[/and]
				layer=base
			[/terrain]
			
			[terrain]
				terrain=*^Vm
				[and]
					terrain=*^V*
				[/and]
				layer=overlay
			[/terrain]
			[terrain]
				terrain=^Wkf
				[and]
					terrain=*^F*
				[/and]
				layer=overlay
			[/terrain]
			[terrain]
				terrain=^Wkf
				[and]
					terrain=*^T*
				[/and]
				layer=overlay
			[/terrain]
			[terrain]
				terrain=^Ewsh
				[and]
					terrain=*^E*
				[/and]
				layer=overlay
			[/terrain]
			[terrain]
