		[event]
			name=prestart

			[sound_source]
				id=sound_underwaterscenery
				sounds="data/add-ons/Animated_Weather_and_Scenery/sounds/underwater.wav"
				loop=-1
				full_range=100
				fade_range=100
				check_fogged=false
				check_shrouded=false
				x,y=10,10
			[/sound_source]

			[AWaS_Create_Basic_Scenery]
				id=id_underwaterscenery
				Scenery_Type=underwater
					[filter_location]
						x=10
						y=10
						radius=100
					[/filter_location]
			[/AWaS_Create_Basic_Scenery]
			
			[AWaS_Create_Basic_Scenery]
				id=id_underwaterscenery_deeper
				Scenery_Type=underwater
				[filter_location]
					terrain=*^Qhu,*^_ml,*^_mll
					[and]
						x=10
						y=10
						radius=100
					[/and]
				[/filter_location]
			[/AWaS_Create_Basic_Scenery]
		
			[AWaS_Create_Basic_Scenery]
				id=id_underwaterscenery3
				Scenery_Type=bubble_bursts
				[filter_location]
						x=10
						y=10
						radius=100
				[/filter_location]
			[/AWaS_Create_Basic_Scenery]
			
			[AWaS_Create_Basic_Scenery]
				id=id_underwaterscenery4
				Scenery_Type=bubble_streams
					[filter_location]
						x=10
						y=10
						radius=100
					[/filter_location]
			[/AWaS_Create_Basic_Scenery]
		[/event]

		[event]
			name=unit placed
			first_time_only=no
			id=uwe_deepsea_movementcost
			
			[filter]
				type=Tentacle of the Deep,Caribe, Great Seahorse,Nibbler,Water Snakelet,Cuttle Fish, Water Serpent,Hunter Caribe
			[/filter]
			
			[modify_unit]
				[filter]
					type=Tentacle of the Deep,Caribe, Great Seahorse,Nibbler,Water Snakelet,Cuttle Fish, Water Serpent,Hunter Caribe
				[/filter]
				[object]
					[effect]
						apply_to=movement_costs
						replace=yes
						[movement_costs]
							deep_water=1
							shallow_water=2
							reef=2
							swamp_water=2
							flat=2
							sand=2
							forest=2
							hills=2
							mountains=3
							village=2
							castle=1
							cave=2
							frozen=2
							fungus=2
						[/movement_costs]
					[/effect]
					[effect]
						apply_to=defense
						replace=yes
						[defense]
							deep_water=40
							shallow_water=50
							reef=50
							swamp_water=50
							flat=50
							sand=50
							forest=50
							hills=50
							mountains=50
							village=50
							castle=50
							cave=50
							frozen=50
							fungus=50
						[/defense]
					[/effect]
				[/object]
			[/modify_unit]
		[/event]
