		[load_resource]
			id=AWaS_Event_Handeling
		[/load_resource]

		## turns any MP map into a underwater map
		[event]
			name=prestart

			[terrain]
				terrain=Ds
				[and]
					terrain=G*^*, S*^*
				[/and]
				layer=base
			[/terrain]
			[terrain]
				terrain=Ds
				[and]
					terrain=R*^*
				[/and]
				layer=base
			[/terrain]
			[terrain]
				terrain=Uu
				[and]
					terrain=Tb*^*
				[/and]
				layer=base
			[/terrain]
			[terrain]
				terrain=Mdd
				[and]
					terrain=!,Mv*^*,Mv*,!,M*^*,M*^Xm
				[/and]
				layer=base
			[/terrain]
			[terrain]
				terrain=Hd
				[and]
					terrain=H*^*
				[/and]
