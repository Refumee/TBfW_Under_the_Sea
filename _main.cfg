			[/terrain]
			[terrain]
				terrain=^Esd
				[and]
					terrain=*^G*,*^W*
				[/and]
				layer=overlay
			[/terrain]

			[terrain]
				terrain=Ds^Qhu
				[and]
					terrain=!,Ww*^V*,!,Ww*^*
				[/and]
				layer=both
			[/terrain]
			[terrain]
				terrain=Dd^Qhu
				[and]
					terrain=!,Wo*^V*,!,Wo*^*
				[/and]
				layer=both
			[/terrain]
			[terrain]
				terrain=Dd^Vm
				[and]
					terrain=Wo*^V*
				[/and]
				layer=both
