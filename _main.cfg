			[/terrain]
			[terrain]
				terrain=Dd^_mll
				[and]
					terrain=Dd^Qhu
					[filter_adjacent_location]
						terrain=Dd^Qhu
						count=6
					[/filter_adjacent_location]
				[/and]
				layer=both
			[/terrain]
