#textdomain wesnoth-Across_the_Ocean
[unit_type]
    id=UWE Elder Carapace
    name= _ "Carapacian Elder"
    race=carapace
    gender=male
    image="units/carapace-uwe/elder.png"
    hitpoints=38
    movement_type=uwe_carapace
    movement=4
    experience=90
    level=2
    alignment=neutral
    advances_to=Divine Carapace
    cost=35
    usage=mixed fighter
    description= _ "Among the Carapacians, some grow into the role of Elders, bearing the wisdom of their tribe and the secrets of the deep earth. Gifted with rare magical talent, they use primal chants to strengthen their kin and sense threats before they emerge.."
    die_sound=drake-die.ogg
    [abilities]
		{ABILITY_STORMHEART}
    [/abilities]

    [healing_anim]
        start_time=-300
        [frame]
            image="units/carapace-uwe/elder.png:[50,60,70,80,90,100*2]"
            halo="halo/saurian-magic-halo[1~7].png"
        [/frame]
    [/healing_anim]
    [attack]
        name=staff
        description=_"staff"
        icon=attacks/staff-green.png
        type=impact
        range=melee
        damage=5
        number=2
    [/attack]
    [attack]
        name=staff magic
        description=_"staff magic"
        icon=attacks/staff-green.png
        type=arcane
        range=ranged
        damage=8
        number=2
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
[/unit_type]
