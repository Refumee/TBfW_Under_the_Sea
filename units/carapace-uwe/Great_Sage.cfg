#textdomain wesnoth-Across_the_Ocean
[unit_type]
    id=UWE Great Sage Carapace
    name= _ "Carapacian Great Sage"
    race=carapace
    gender=male
    image="units/carapace-uwe/divine.png"
    hitpoints=47
    movement_type=uwe_carapace
    movement=5
    experience=112
    level=3
    alignment=neutral
    advances_to=null
    {AMLA_DEFAULT}
    cost=45
    usage=mixed fighter
    description= _ "Diviners are the most revered mystics of the Carapacian tribe, said to feel the rhythms of the earth and the movements of hidden creatures. Their power is rare and mysterious, guiding their kin with visions and wielding magic that heals allies and wards off foes."

    die_sound=drake-die.ogg

	{ANIM_IDLE_DEFEND_STORMHEART "divine"}

    [abilities]
		{ABILITY_STORMHEART}
		{ABILITY_STEADFAST}
    [/abilities]

    [healing_anim]
        start_time=-300
        [frame]
            image="units/carapace-uwe/divine.png:[50,60,70,80,90,100*2]"
            halo="halo/saurian-magic-halo[1~7].png"
        [/frame]
    [/healing_anim]
    [attack]
        name=staff
        description=_"staff"
        icon=attacks/staff-ruby.png
        type=impact
        range=melee
        damage=7
        number=2
    [/attack]
    [attack]
        name=crystal rod
        description=_"crystal rod"
        icon=attacks/iceball.png
        type=arcane
        range=ranged
        damage=9
        number=3
        [specials]
            {WEAPON_SPECIAL_MAGICAL}
        [/specials]
    [/attack]
[/unit_type]
