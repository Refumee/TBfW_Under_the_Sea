#textdomain wesnoth-Across_the_Ocean
[unit_type]
    id=UWE Eel Pulse
    name= _ "Eel Pulse"
    race=monster
    image="units/carapace-uwe/eel_pulse.png"
    hitpoints=27
    movement_type=uwe_swimmer
    movement=9
    experience=37
    level=1
    alignment=chaotic
    advances_to=UWE Eel Vanguard
    cost=23
    usage=scout
    description= _ "Todo."
    die_sound=hiss-die.wav

    [abilities]
		{ABILITY_STORMHEART}
    [/abilities]
    {ANIM_IDLE_DEFEND_STORMHEART_EEL "eel_pulse" hiss-hit.wav}

    [standing_anim]
        start_time=0
        eel_start_time=0
        eel_y=-3~0:300,0~-3:300
		[frame]
			image="units/carapace-uwe/eel_shadow.png:200"
        [/frame]
        [eel_frame]
			image="units/carapace-uwe/eel_pulse.png:200"
            auto_vflip=no
            primary=yes
        [/eel_frame]
    [/standing_anim]

    [movement_anim]
        start_time=0
        eel_start_time=0
        eel_offset="0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200,0~1:200"
		[frame]
			image="units/carapace-uwe/eel_shadow.png:160"
        [/frame]
        [eel_frame]
			image="units/carapace-uwe/eel_pulse.png:160"
            auto_vflip=no
            primary=yes
        [/eel_frame]
    [/movement_anim]

    [attack]
        name=fangs
        description=_"fangs"
        icon=attacks/fangs.png
        type=blade
        range=melee
        damage=5
        number=2
    [/attack]
    [attack]
        name=shock
        description=_"shock"
        icon=attacks/lightning.png
        type=arcane
        range=ranged
        [specials]
            {WEAPON_SPECIAL_MARKSMAN}
        [/specials]
        damage=6
        number=3
    [/attack]

[/unit_type]
