        description=_"water breath"
        icon=attacks/waterspray.png
        type=impact
        range=ranged
        damage=9
        number=4
    [/attack]
	
	{MELEE_ANIM claws claws.ogg {SOUND_LIST:MISS}}
	{RANGE_ANIM_WATERBLAST}
